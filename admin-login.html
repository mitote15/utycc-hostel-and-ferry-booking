<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTYCC Smart Campus Portal - Admin Portal Login</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0284c7;
            --primary-hover: #0369a1;
            --accent-teal: #0d9488;
            --bg-light: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(14, 165, 233, 0.18);
            --border-glow: rgba(2, 132, 199, 0.35);
            --text-main: #0f172a;
            --shadow-glass: 0 10px 30px -5px rgba(2, 132, 199, 0.08);
            --shadow-glow: 0 12px 35px rgba(2, 132, 199, 0.18);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(13, 148, 136, 0.08) 0px, transparent 50%);
        }

        h1, h2, h3, h4, h5, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        .navbar-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
        }

        .card-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1.25rem;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s ease;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, var(--primary-hover), #0f766e);
            color: white;
            box-shadow: var(--shadow-glow);
            transform: translateY(-1px);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.15);
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        footer {
            margin-top: auto;
            background: #0f172a;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-glass sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="home.html">
                <div class="brand-badge"><i class="bi bi-mortarboard-fill"></i></div>
                <span>UTYCC <span class="text-primary">Portal</span></span>
            </a>
            <div class="ms-auto d-flex align-items-center gap-2">
                <a class="btn btn-outline-secondary btn-sm rounded-pill px-3" href="home.html">
                    <i class="bi bi-house me-1"></i> Student Portal
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card card-glass p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.8rem; background: linear-gradient(135deg, #0f172a, #0284c7);">
                            <i class="bi bi-person-badge-fill"></i>
                        </div>
                        <h3 class="fw-bold font-heading mb-1">Admin Portal</h3>
                        <p class="text-muted small mb-0">UTYCC Enterprise Role-Based Portal</p>
                    </div>

                    <!-- Alert Banner -->
                    <div id="adminAlert" class="alert alert-dismissible fade show d-none" role="alert">
                        <span id="alertMessage"></span>
                        <button type="button" class="btn-close" onclick="hideAlert()"></button>
                    </div>

                    <!-- Super Admin Credentials Info -->
                    <div class="bg-primary bg-opacity-10 border border-primary border-opacity-25 rounded-3 p-3 mb-4">
                        <div class="fw-bold text-primary small mb-1 d-flex align-items-center">
                            <i class="bi bi-shield-check me-1"></i> Default Super Admin Credentials
                        </div>
                        <div class="d-flex justify-content-around font-monospace small bg-white p-2 rounded-2 border mt-2">
                            <div><span class="text-muted me-1">User:</span><strong class="text-dark">admin</strong></div>
                            <div><span class="text-muted me-1">Pass:</span><strong class="text-dark">admin123</strong></div>
                        </div>
                    </div>

                    <!-- Admin Login Form -->
                    <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Target Console Role</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
                                <select id="adminRole" class="form-select border-start-0 ps-0">
                                    <option value="super_admin">Super Administrator (Unique)</option>
                                    <option value="hostel">Hostel Administrator</option>
                                    <option value="ferry">Ferry Administrator</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-muted">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" id="adminUsername" class="form-control border-start-0 ps-0" placeholder="e.g., admin" value="admin" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" id="adminPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" value="admin123" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-glow w-100 py-2 fw-semibold rounded-3 mb-3">
                            Login to Console <i class="bi bi-shield-check ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">Not an admin?</span>
                        <a href="login.html?reset=true" class="text-primary fw-semibold small text-decoration-none ms-1">
                            Student Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container text-center">
            <p class="mb-0 small">© 2026 UTYCC Smart Campus Enterprise Portal. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = window.location.origin.includes("http") ? window.location.origin : "http://localhost:8080";

        document.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('utycc_admin');
            localStorage.removeItem('admin');
        });

        function showAlert(msg, type = 'danger') {
            const alert = document.getElementById('adminAlert');
            const alertMsg = document.getElementById('alertMessage');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alertMsg.textContent = msg;
            alert.classList.remove('d-none');
        }

        function hideAlert() {
            document.getElementById('adminAlert').classList.add('d-none');
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const role = document.getElementById('adminRole').value;
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value.trim();

            try {
                const res = await fetch(API_BASE_URL + '/api/admin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password, role })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('Authenticated successfully! Loading dashboard...', 'success');
                    localStorage.setItem('utycc_admin', JSON.stringify(data.admin));
                    localStorage.setItem('admin', JSON.stringify(data.admin));
                    setTimeout(() => { window.location.href = 'admin.html'; }, 800);
                } else {
                    showAlert(data.message || 'Invalid credentials or unauthorized role access.');
                }
            } catch (err) {
                showAlert('Network error or server unavailable.');
            }
        }
    </script>
</body>
</html>
