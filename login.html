<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTYCC Smart Campus Portal - Student Login & Registration</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0284c7;
            --primary-hover: #0369a1;
            --accent-teal: #0d9488;
            --accent-emerald: #059669;
            --accent-amber: #d97706;
            --bg-light: #f8fafc;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border-glass: rgba(14, 165, 233, 0.18);
            --border-glow: rgba(2, 132, 199, 0.35);
            --text-main: #0f172a;
            --text-muted: #475569;
            --shadow-glass: 0 10px 30px -5px rgba(2, 132, 199, 0.08);
            --shadow-glow: 0 12px 35px rgba(2, 132, 199, 0.18);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(at 0% 0%, rgba(2, 132, 199, 0.08) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(13, 148, 136, 0.08) 0px, transparent 50%);
        }

        h1, h2, h3, h4, h5, .font-heading {
            font-family: 'Space Grotesk', sans-serif;
        }

        .navbar-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
        }

        .card-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 1.25rem;
            box-shadow: var(--shadow-glass);
            transition: all 0.3s ease;
        }

        .btn-glow {
            background: linear-gradient(135deg, var(--primary-blue), var(--accent-teal));
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            background: linear-gradient(135deg, var(--primary-hover), #0f766e);
            color: white;
            box-shadow: var(--shadow-glow);
            transform: translateY(-1px);
        }

        .nav-pills .nav-link {
            color: var(--text-muted);
            border-radius: 0.75rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s ease;
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary-blue);
            color: white;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.15);
        }

        .brand-badge {
            background: linear-gradient(135deg, #0284c7, #0d9488);
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        footer {
            margin-top: auto;
            background: #0f172a;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-glass sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="home.html">
                <div class="brand-badge"><i class="bi bi-mortarboard-fill"></i></div>
                <span>UTYCC <span class="text-primary">Portal</span></span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-collapse nav nav-pills ms-auto gap-1 me-3">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="hostel.html">Hostels</a></li>
                    <li class="nav-item"><a class="nav-link" href="ferry.html">Ferries</a></li>
                </ul>
                <a class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-semibold" href="admin-login.html">
                    <i class="bi bi-person-badge-fill me-1"></i> Admin Portal
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="card card-glass p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-badge mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.8rem;">
                            <i class="bi bi-shield-lock-fill"></i>
                        </div>
                        <h3 class="fw-bold font-heading mb-1">Student Portal Access</h3>
                        <p class="text-muted small">UTYCC Ferry & Hostel Management System</p>
                    </div>

                    <!-- Navigation Tabs -->
                    <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button">
                                <i class="bi bi-person-plus me-1"></i> Register
                            </button>
                        </li>
                    </ul>

                    <!-- Alert Banner -->
                    <div id="authAlert" class="alert alert-dismissible fade show d-none" role="alert">
                        <span id="alertMessage"></span>
                        <button type="button" class="btn-close" onclick="hideAlert()"></button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="tab-content" id="authTabsContent">
                        <!-- Login Pane -->
                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
                            <form id="loginForm" onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-muted">Student ID / Roll No.</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-card-text"></i></span>
                                        <input type="text" id="loginStudentId" class="form-control border-start-0 ps-0" placeholder="e.g., 5ECE-12" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small text-muted">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                        <input type="password" id="loginPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-glow w-100 py-2 fw-semibold rounded-3 mb-3">
                                    Sign In <i class="bi bi-arrow-right ms-1"></i>
                                </button>
                            </form>
                        </div>

                        <!-- Register Pane -->
                        <div class="tab-pane fade" id="register-pane" role="tabpanel">
                            <form id="registerForm" onsubmit="handleRegister(event)">
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-muted">Full Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                        <input type="text" id="regName" class="form-control border-start-0 ps-0" placeholder="e.g., Mg Mg" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-muted">Student Roll ID</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-card-heading"></i></span>
                                        <input type="text" id="regStudentId" class="form-control border-start-0 ps-0" placeholder="e.g., 5CPE-05" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-muted">University Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                        <input type="email" id="regEmail" class="form-control border-start-0 ps-0" placeholder="student@utycc.edu.mm" required>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-semibold small text-muted">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-telephone"></i></span>
                                        <input type="tel" id="regPhone" class="form-control border-start-0 ps-0" placeholder="09123456789" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label fw-semibold small text-muted">Create Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="regPassword" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-glow w-100 py-2 fw-semibold rounded-3 mb-3">
                                    Create Student Account <i class="bi bi-check-circle ms-1"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                    <div class="text-center mt-3 pt-3 border-top">
                        <span class="text-muted small">Are you an Administrator?</span>
                        <a href="admin-login.html" class="text-primary fw-semibold small text-decoration-none ms-1">
                            Admin Sign In
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-4">
        <div class="container text-center">
            <p class="mb-0 small">© 2026 UTYCC Smart Campus Enterprise Portal. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = window.location.origin.includes("http") ? window.location.origin : "http://localhost:8080";

        document.addEventListener('DOMContentLoaded', () => {
            const userJson = localStorage.getItem('user');
            if (userJson) {
                window.location.href = 'home.html';
            }
        });
        
        function showAlert(msg, type = 'danger') {
            const alert = document.getElementById('authAlert');
            const alertMsg = document.getElementById('alertMessage');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alertMsg.textContent = msg;
            alert.classList.remove('d-none');
        }

        function hideAlert() {
            document.getElementById('authAlert').classList.add('d-none');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const studentId = document.getElementById('loginStudentId').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            try {
                const res = await fetch(API_BASE_URL + '/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: studentId, password: password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('Login successful! Redirecting...', 'success');
                    localStorage.setItem('user', JSON.stringify(data.user));
                    setTimeout(() => { window.location.href = 'home.html'; }, 1000);
                } else {
                    showAlert(data.message || 'Invalid Student ID or password.');
                }
            } catch (err) {
                showAlert('Server connection error. Please ensure python server is running.');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const studentId = document.getElementById('regStudentId').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            try {
                const res = await fetch(API_BASE_URL + '/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, student_id: studentId, email, phone, password })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showAlert('Account created successfully! Please log in.', 'success');
                    document.getElementById('registerForm').reset();
                    setTimeout(() => {
                        const loginTab = new bootstrap.Tab(document.getElementById('login-tab'));
                        loginTab.show();
                    }, 1200);
                } else {
                    showAlert(data.message || 'Registration failed. Roll ID may already exist.');
                }
            } catch (err) {
                showAlert('Server connection error during registration.');
            }
        }
    </script>
</body>
</html>
